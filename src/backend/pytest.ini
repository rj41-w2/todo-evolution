[pytest]
testpaths = tests

# `test_external_seams.py` needs a real PostgreSQL with Better Auth migrations
# applied. Registering the marker keeps it discoverable and lets CI deselect it
# explicitly instead of failing on an unknown-mark warning.
markers =
    integration: requires a live database; deselected by default

# Integration tests are opt-in. Run them with: pytest -m integration
addopts = -m "not integration"

filterwarnings =
    ignore::DeprecationWarning:sqlalchemy.*
