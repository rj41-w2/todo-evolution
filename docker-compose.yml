services:
  # One-shot: Better Auth owns user/session/account/verification/jwks. Those must
  # exist before the backend's migrations, because tasks/conversations/messages
  # have foreign keys into "user"."id". Runs the frontend's builder stage (deps +
  # source, no Next.js build) and exits.
  auth-migrate:
    build:
      context: ./frontend
      target: builder
    command: ["npx", "auth", "migrate", "--yes"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
    networks:
      - todo-network

  backend:
    build:
      context: ./src/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWKS_URL=${JWKS_URL:-http://frontend:3000/api/auth/jwks}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - MCP_SERVER_URL=http://mcp:8001/sse
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      mcp:
        condition: service_started
    networks:
      - todo-network

  mcp:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.mcp
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MCP_TRANSPORT=sse
    networks:
      - todo-network

  frontend:
    build:
      context: ./frontend
      args:
        - INTERNAL_BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - INTERNAL_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge