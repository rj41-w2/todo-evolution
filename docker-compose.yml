services:
  # One-shot: Better Auth owns user/session/account/verification/jwks. Those must
  # exist before the backend's migrations, because tasks/conversations/messages
  # have foreign keys into "user"."id". Runs the frontend's builder stage (deps +
  # source, no Next.js build) and exits.
  auth-migrate:
    build:
      context: ./frontend
      target: builder
    command: ["npx", "auth", "migrate", "--yes"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
    networks:
      - todo-network

  # The MCP task tools are NOT a service. They run as a stdio subprocess of
  # /api/{user_id}/chat, spawned per request and bound to the JWT-verified user.
  # They used to be a standalone SSE service published on 8001 with no auth, and
  # every tool took user_id as an argument — see src/backend/mcp_server.py.
  backend:
    build:
      context: ./src/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - JWKS_URL=${JWKS_URL:-http://frontend:3000/api/auth/jwks}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    # Liveness-only probe. Deliberately /health, NOT /ready: /ready calls the
    # JWKS endpoint on the *frontend*, and the frontend below waits for the
    # backend to be healthy — gating that dependency on /ready would deadlock
    # the whole stack (each side waiting for the other to start).
    # start_period covers `alembic upgrade head` against a suspended Neon.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - todo-network

  frontend:
    build:
      context: ./frontend
      args:
        - INTERNAL_BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - INTERNAL_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge