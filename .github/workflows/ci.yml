name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m unittest discover -s tests -v

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Retry flags mirror the backend Dockerfile. PyPI read timeouts are common
      # enough here that a bare `pip install` turns into a flaky red build.
      - run: pip install --default-timeout=100 --retries 5 -r requirements.txt -r requirements-dev.txt
      # Hard gate: the API and MCP services must boot from a cold interpreter.
      # This is the step that catches an import/startup regression (issue #1).
      - run: python -m pytest tests/test_bootability.py -v
      # Hard gate: task tenancy at the MCP tool layer (issue #2). Deliberately
      # NOT continue-on-error. The bug this guards was a silent cross-tenant
      # read/write, and a non-blocking step would have hidden exactly that: the
      # tests were never written, so nothing was ever red to notice.
      - run: python -m pytest tests/test_mcp_authz.py -v
      # The rest of the hermetic suite. These were previously allowed to fail
      # behind `continue-on-error` while ten tests sat broken and unreported
      # (issue #9). They are green now, so the flag is gone: a step that can
      # only ever turn green is not a check.
      - run: python -m pytest -v

  # Database-backed checks, split out so the fast gates above stay fast.
  #
  # These cannot live in the `backend` job. Every test there is hermetic —
  # `create_engine` is lazy and the URL is never dialled — because CI has no
  # PostgreSQL and standing one up for every run would tax the fast path for
  # tests that mostly assert wiring. Issue #8 asked for exactly this split.
  #
  # What this job buys is the class of bug nothing else can see. `POST /tasks`
  # answered 201 Created and wrote nothing, for as long as the only endpoint
  # tests were mocks: a mock confirms a repository was *called* just as happily
  # about a write that was rolled back a millisecond later.
  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: todorev
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/todorev
      CORS_ORIGINS: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-not-a-real-credential
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          # Node 24, matching the frontend image (`FROM node:24-bookworm-slim`).
          # `npx auth` pulls in chevrotain, which calls `Object.groupBy` — a
          # Node 21+ API. Running the auth migration on Node 20 failed with
          # `TypeError: Object.groupBy is not a function`. More to the point,
          # the migration should run on the runtime it actually ships on.
          node-version: 24
      - run: pip install --default-timeout=100 --retries 5 -r requirements.txt -r requirements-dev.txt
      # Better Auth owns `user`, `session`, `account`, `verification` and
      # `jwks`. The application tables have foreign keys into `user`, so this
      # must run first. It runs from the frontend because that is where `auth`
      # and its config live; a hand-written SQL stand-in would drift from the
      # real schema, and the point of these tests is to verify the real
      # contract.
      - name: Better Auth schema
        working-directory: frontend
        run: |
          npm ci
          npx auth migrate --yes
      - name: Application schema
        run: alembic upgrade head
      - name: Database-backed checks
        run: python -m pytest -m integration -v
      # The image the backend actually ships. Its CMD runs `alembic upgrade head`
      # before uvicorn, so this covers startup order and packaging together —
      # the two things a test against the source tree cannot check.
      #
      # `--network host` is required, not incidental. The Postgres service is
      # published on the runner's own localhost, and inside a container
      # `localhost` means the container. The first attempt to run this passed
      # `DATABASE_URL` straight through and failed with
      # `connection to server at "localhost" ... Connection refused`.
      - name: Production container starts and serves
        run: |
          docker build -t todo-backend .
          docker run -d --name todo-backend --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e CORS_ORIGINS="$CORS_ORIGINS" \
            -e GEMINI_API_KEY="" \
            todo-backend
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "container healthy after ${i} polls"
              curl -sf http://localhost:8000/health
              docker rm -f todo-backend
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy; logs:"
          docker logs todo-backend
          docker rm -f todo-backend
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
